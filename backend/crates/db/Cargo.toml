[package]
name = "fuber-db"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fuber-common = { version = "0.1.0", path = "../common" }
fuber-domain = { version = "0.1.0", path = "../domain" }
secrecy = "0.10.3"
serde_json = "1.0.154"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "migrate", "macros", "uuid", "time", "json"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tracing = "0.1.44"
uuid = "1.29.0"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
