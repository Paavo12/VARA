[package]
name = "fuber-common"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
dotenvy = "0.15.7"
ed25519-dalek = "3.0.0"
hmac = "0.13.0"
rand = "0.10.3"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "macros", "formatting", "parsing"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "0.1.26"
utoipa = { version = "5.5.0", features = ["uuid", "time"] }
zeroize = "1.9.1"

[lints]
workspace = true
