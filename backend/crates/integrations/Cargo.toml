[package]
name = "fuber-integrations"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
fuber-common = { version = "0.1.0", path = "../common" }
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["fs", "io-util", "net", "time", "sync"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
time = { version = "0.3.55", features = ["macros"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
