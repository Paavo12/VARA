[package]
name = "fuber-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
fuber-common = { version = "0.1.0", path = "../common" }
fuber-db = { version = "0.1.0", path = "../db" }
fuber-domain = { version = "0.1.0", path = "../domain" }
rand = "0.10.3"
redis = { version = "1.2.2", features = ["tokio-comp", "connection-manager", "script"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.7.1", features = ["cors", "limit", "timeout", "trace", "set-header", "request-id", "util"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
