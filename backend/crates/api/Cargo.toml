[package]
name = "fuber-api"
default-run = "fuber-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
fuber-common = { version = "0.1.0", path = "../common" }
fuber-db = { version = "0.1.0", path = "../db" }
fuber-domain = { version = "0.1.0", path = "../domain" }
fuber-integrations = { version = "0.1.0", path = "../integrations" }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
rand = "0.10.3"
redis = { version = "1.2.2", features = ["tokio-comp", "connection-manager", "script"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.8.6", default-features = false, features = ["json", "postgres", "time", "uuid"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "macros", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.7.1", features = ["cors", "limit", "timeout", "trace", "set-header", "request-id", "util"] }
tracing = "0.1.44"
unicode-normalization = "0.1.26"
utoipa = { version = "5.5.0", features = ["uuid", "time"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
zeroize = "1.9.1"

[lints]
workspace = true

[dev-dependencies]
argon2 = "0.6.0"
fuber-integrations = { path = "../integrations" }
fuber-worker = { path = "../worker" }
futures-util = "0.3.34"
http-body-util = "0.1.5"
image = { version = "0.25.10", default-features = false, features = ["png"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5.3", features = ["util"] }
