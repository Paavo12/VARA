# cargo-deny policy (TRD §7.7). CI runs: cargo deny check advisories bans sources licenses

[advisories]
# Fail on any vulnerability or unmaintained/yanked crate advisory.
yanked = "deny"

[licenses]
# Permissive licences only; our own crates are UNLICENSED (private).
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "BSL-1.0", "CDLA-Permissive-2.0", "MPL-2.0"]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by path, with no version. None is published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
