name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fuber
          POSTGRES_PASSWORD: fuber-ci
          POSTGRES_DB: fuber
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fuber" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fuber:fuber-ci@localhost:5432/fuber
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: OpenAPI document is up to date
        run: |
          cargo run -q -p fuber-api --bin openapi > ../packages/api-client/openapi.json
          git diff --exit-code -- ../packages/api-client/openapi.json

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: backend/Cargo.toml
          command: check advisories bans sources licenses

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Generated API client types are up to date
        run: |
          npm run types -w @fuber/api-client
          git diff --exit-code -- packages/api-client/src/schema.d.ts

  secrets:
    runs-on: ubuntu-latest
    # gitleaks lists the pull request's commits to scan them.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
