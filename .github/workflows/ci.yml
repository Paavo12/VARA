name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fuber
          POSTGRES_PASSWORD: fuber-ci
          POSTGRES_DB: fuber
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fuber" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fuber:fuber-ci@localhost:5432/fuber
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: OpenAPI document is up to date
        run: |
          cargo run -q -p fuber-api --bin openapi > ../packages/api-client/openapi.json
          git diff --exit-code -- ../packages/api-client/openapi.json

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: backend/Cargo.toml
          command: check advisories bans sources licenses

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Moderate too: the SvelteKit adapters are devDependencies but run in the ops and website servers.
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Generated API client types are up to date
        run: |
          npm run types -w @fuber/api-client
          git diff --exit-code -- packages/api-client/src/schema.d.ts

  secrets:
    runs-on: ubuntu-latest
    # gitleaks lists the pull request's commits to scan them.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.17"
      - run: terraform fmt -check -recursive
      # No backend and no credentials: checks syntax, types and provider schemas only.
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # Staging deploy on every push to main once every check above has passed (TRD §2.3).
  # Authenticates with Workload Identity Federation: no service-account key exists anywhere.
  # Setup and the repository variables it reads: infra/terraform/README.md.
  deploy-staging:
    needs: [backend, dependencies, frontend, secrets, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY: ${{ vars.GCP_REGISTRY }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push images
        working-directory: backend
        run: |
          for target in api worker migrate; do
            docker buildx build --target "$target" \
              --cache-from type=gha,scope=backend --cache-to type=gha,scope=backend,mode=max \
              --tag "$REGISTRY/$target:$TAG" --push .
          done
      - name: Run migrations
        run: |
          gcloud run jobs update "${{ vars.GCP_MIGRATE_JOB }}" --region "$REGION" --image "$REGISTRY/migrate:$TAG"
          gcloud run jobs execute "${{ vars.GCP_MIGRATE_JOB }}" --region "$REGION" --wait
      - name: Deploy worker
        run: gcloud run worker-pools deploy "${{ vars.GCP_WORKER_POOL }}" --region "$REGION" --image "$REGISTRY/worker:$TAG"
      - name: Deploy API
        run: gcloud run deploy "${{ vars.GCP_API_SERVICE }}" --region "$REGION" --image "$REGISTRY/api:$TAG"
      - name: Health check
        run: |
          url=$(gcloud run services describe "${{ vars.GCP_API_SERVICE }}" --region "$REGION" --format 'value(status.url)')
          for i in $(seq 1 10); do
            curl -fsS "$url/v1/health" && exit 0
            sleep 6
          done
          echo "::error::$url/v1/health did not answer"
          exit 1
